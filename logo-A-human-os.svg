<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Schibsted Grotesk, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
